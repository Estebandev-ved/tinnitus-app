# =====================
# Development Profile
# =====================

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,https://tinnitusoff-e61c4.web.app

# JWT (dev only - random key on restart)
jwt.secret=dev-only-secret-not-for-production-minimum-32-chars!!
jwt.access-expiration=900000
jwt.refresh-expiration=604800000

# HTTP local (sin HTTPS): la cookie no puede llevar Secure=true o el navegador la descarta
app.cookie.secure=false

# Admin seed (dev only — el perfil base ya no trae un valor por defecto)
app.admin.password=dev-only-admin-not-for-prod

# Clinical sync token
clinical.sync-token=dev-clinical-token

# H2 In-Memory DB
spring.datasource.url=jdbc:h2:mem:tinnitusdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway disabled in dev (H2 in-memory, recreated each restart)
spring.flyway.enabled=false
