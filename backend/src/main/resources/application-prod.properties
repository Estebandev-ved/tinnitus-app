# =====================
# Production Profile (Railway / Docker)
# =====================
# Activate with: SPRING_PROFILES_ACTIVE=prod
#
# Variables OBLIGATORIAS (si falta alguna, el arranque falla listandolas — ver ProductionEnvironmentPostProcessor):
#   DATABASE_URL (o PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD) -> Railway las inyecta con el plugin PostgreSQL.
#       Acepta postgresql://user:pass@host:port/db o jdbc:postgresql://host:port/db (+ DATABASE_USERNAME/PASSWORD).
#   JWT_SECRET            >= 32 caracteres aleatorios
#   CLINICAL_SYNC_TOKEN   >= 32 caracteres aleatorios
#   ADMIN_PASSWORD, ADMIN_EMAIL
# Recomendadas: CORS_ORIGINS, ADMIN_USERNAME, FIREBASE_SA_JSON (o FIREBASE_SA), ANTHROPIC_API_KEY (+ opc. ANTHROPIC_MODEL, ANTHROPIC_MAX_TOKENS, AI_PROVIDER),
#   o bien (alternativa) AZURE_OPENAI_API_KEY/ENDPOINT/DEPLOYMENT,
#   AI_LIMIT_PER_MINUTE / AI_LIMIT_PER_DAY / AI_LIMIT_TOKENS_PER_DAY.

# Detras del proxy de Railway: respeta X-Forwarded-Proto/Host (https correcto en redirects/URLs).
server.forward-headers-strategy=framework
# La IP real del cliente viene en X-Forwarded-For (lo usa RateLimitFilter). Solo seguro detras de un proxy de confianza.
app.trust-forwarded-for=true

# CORS: lista separada por comas. Incluye el origen de la app Capacitor (androidScheme https => https://localhost).
app.cors.allowed-origins=${CORS_ORIGINS:https://tinnitusoff-e61c4.web.app,https://tinnitusoff.web.app,https://localhost,capacitor://localhost}

# JWT (REQUIRED - no default)
jwt.secret=${JWT_SECRET}
jwt.access-expiration=900000
jwt.refresh-expiration=604800000

# Clinical sync token (REQUIRED - no default)
clinical.sync-token=${CLINICAL_SYNC_TOKEN}

# PostgreSQL: spring.datasource.url/username/password los calcula ProductionEnvironmentPostProcessor
# a partir de DATABASE_URL o PG*. No se definen aqui a proposito.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1

# JPA/Hibernate: NUNCA create/update en produccion. El esquema lo gestiona Flyway; Hibernate solo valida.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# H2 console disabled in prod
spring.h2.console.enabled=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator minimo (healthcheck de Railway): sin detalles
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Swagger fuera de produccion
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
