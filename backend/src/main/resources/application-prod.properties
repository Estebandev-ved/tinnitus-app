# =====================
# Production Profile
# =====================
# Activate with: java -jar app.jar --spring.profiles.active=prod
#
# Required environment variables:
#   DATABASE_URL=jdbc:postgresql://host:5432/dbname
#   DATABASE_USERNAME=...
#   DATABASE_PASSWORD=...
#   JWT_SECRET=<random-32+ chars>
#   CLINICAL_SYNC_TOKEN=<random-32+ chars>
#   FIREBASE_SA=/path/to/serviceAccount.json
#   ADMIN_USERNAME=admin
#   ADMIN_PASSWORD=<random strong password — no hay valor por defecto>
#   ADMIN_EMAIL=<correo del admin>
#   AZURE_OPENAI_API_KEY=<solo si usas el proxy de IA del backend>

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:https://tinnitusoff-e61c4.web.app,https://tinnitusoff.web.app}

# JWT (REQUIRED - no default)
jwt.secret=${JWT_SECRET}
jwt.access-expiration=900000
jwt.refresh-expiration=604800000

# Clinical sync token (REQUIRED - no default)
clinical.sync-token=${CLINICAL_SYNC_TOKEN}

# PostgreSQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# H2 console disabled in prod
spring.h2.console.enabled=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
