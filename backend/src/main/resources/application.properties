spring.application.name=backend

# =====================
# CORS (orígenes del frontend)
# =====================
app.cors.allowed-origins=http://localhost:*,https://localhost:*,capacitor://localhost,https://tinnitusoff-e61c4.web.app,https://tinnitusoff.web.app

# =====================
# JWT Configuration
# =====================
# SECURITY: Change jwt.secret in production via environment variable JWT_SECRET
jwt.secret=${JWT_SECRET:default-dev-secret-change-in-production-min-32chars}
# Access token: 15 min (lo que pide .claude/rules/security.md). El refresh token
# (7 días) viaja aparte, en una cookie HttpOnly — ver AuthController.
jwt.access-expiration=900000
jwt.refresh-expiration=604800000

# Cookie del refresh token: Secure=true en producción (HTTPS por Nginx). En dev
# se sobreescribe a false en application-dev.properties (HTTP en localhost).
app.cookie.secure=true

# =====================
# Admin credentials (DataInitializer)
# =====================
# SECURITY: sin valores por defecto en username/email/password de producción.
# Define ADMIN_USERNAME / ADMIN_PASSWORD / ADMIN_EMAIL como variables de entorno
# antes de arrancar con el perfil prod (ver application-dev.properties para el
# valor usado solo en desarrollo local).
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD}
app.admin.email=${ADMIN_EMAIL:grubiano23@gmail.com}

# =====================
# Token de sincronización (app móvil -> backend)
# =====================
# En producción define la variable de entorno CLINICAL_SYNC_TOKEN con un secreto fuerte.
# La app móvil debe enviarlo en la cabecera X-Clinical-Token.
clinical.sync-token=${CLINICAL_SYNC_TOKEN:dev-clinical-token}

# =====================
# Azure OpenAI (proxy de IA en el backend)
# =====================
# SECURITY: esta llave vive SOLO en el servidor. El frontend nunca debe verla.
azure.openai.api-key=${AZURE_OPENAI_API_KEY:}
azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:}
azure.openai.deployment=${AZURE_OPENAI_DEPLOYMENT:}

# =====================
# Firebase Admin SDK (push FCM)
# =====================
# Ruta a la cuenta de servicio de Firebase (para enviar notificaciones push).
# En Docker/producción se sobreescribe con la variable de entorno FIREBASE_SA
# (docker-compose.yml ya la define como /app/serviceAccount.json). El valor de
# respaldo de abajo solo aplica cuando corres el backend directo en esta máquina.
firebase.sa-path=${FIREBASE_SA:C:/Users/Lenovo/Desktop/tinnitus-app/firebase/tinnitusoff-e61c4-firebase-adminsdk-fbsvc-78ab542b54.json}

# =====================
# PostgreSQL (persistente - los datos sobreviven reinicios)
# =====================
# El servidor PostgreSQL corre en localhost:5432 con auth trust en 127.0.0.1.
# Flyway se mantiene desactivado y Hibernate genera/actualiza el esquema
# desde las entidades (evita el desfase del esquema base V1).
spring.flyway.enabled=false
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/tinnitusdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# =====================
# Swagger / Actuator / Connection Pool
# =====================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000

# File upload limit
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Codificación UTF-8 (para acentos en contenido, usuarios, etc.)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
