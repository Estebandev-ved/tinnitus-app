version: '3.8'

services:
  # ========================
  # PostgreSQL Database
  # ========================
  postgres:
    image: postgres:16-alpine
    container_name: tinnitoff-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tinnitusdb
      POSTGRES_USER: ${DB_USERNAME:-tinnitoff}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-tinnitoff} -d tinnitusdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tinnitoff-net

  # ========================
  # Spring Boot Backend
  # ========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tinnitoff-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/tinnitusdb
      DATABASE_USERNAME: ${DB_USERNAME:-tinnitoff}
      DATABASE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CLINICAL_SYNC_TOKEN: ${CLINICAL_SYNC_TOKEN:?Set CLINICAL_SYNC_TOKEN in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      FIREBASE_SA: /app/serviceAccount.json
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0"
    volumes:
      - ./serviceAccount.json:/app/serviceAccount.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    networks:
      - tinnitoff-net

  # ========================
  # Nginx Reverse Proxy + HTTPS
  # ========================
  nginx:
    image: nginx:alpine
    container_name: tinnitoff-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./web/dist:/usr/share/nginx/html:ro
    networks:
      - tinnitoff-net

  # ========================
  # Prometheus (Metrics)
  # ========================
  prometheus:
    image: prom/prometheus:latest
    container_name: tinnitoff-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - tinnitoff-net

  # ========================
  # Grafana (Dashboards)
  # ========================
  grafana:
    image: grafana/grafana:latest
    container_name: tinnitoff-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - tinnitoff-net

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  tinnitoff-net:
    driver: bridge
